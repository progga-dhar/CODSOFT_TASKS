<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melody - Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

```
<div class="music-container">

    <header>
        <h2><i class="fas fa-music"></i> Melody</h2>
        <button id="themeBtn"><i class="fas fa-moon"></i></button>
    </header>

    <main class="player">

        <div class="album-art">
            <img id="cover" src="images/cover1.jpg" alt="Album Artwork">
        </div>

        <div class="song-info">
            <h2 id="title">Song Title</h2>
            <p id="artist">Artist Name</p>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar">
                <div class="progress" id="progress"></div>
            </div>

            <div class="time">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <audio id="audio"></audio>

        <div class="controls">

            <button id="shuffleBtn"><i class="fas fa-shuffle"></i></button>

            <button id="prevBtn"><i class="fas fa-backward-step"></i></button>

            <button id="playBtn" class="play-btn">
                <i class="fas fa-play"></i>
            </button>

            <button id="nextBtn"><i class="fas fa-forward-step"></i></button>

            <button id="repeatBtn"><i class="fas fa-repeat"></i></button>

        </div>

        <div class="volume-container">
            <button id="muteBtn"><i class="fas fa-volume-high"></i></button>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
        </div>

        <button id="favoriteBtn" class="favorite-btn">
            <i class="far fa-heart"></i> Add to Favorites
        </button>

    </main>

    <section class="playlist-section">
        <h3><i class="fas fa-list"></i> Your Playlist</h3>
        <div id="playlist"></div>
    </section>

</div>

<script src="script.js"></script>
```

</body>
</html>
